name: CI - Smoke Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  smoke-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Executar Smoke Tests
        run: mvn --batch-mode test -Psmoke -Dbrowser=chrome -Dheadless=true

      - name: Upload dos screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: target/screenshots/

      - name: Upload dos relatórios do Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/